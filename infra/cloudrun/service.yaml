apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: chatrag
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "3"
        run.googleapis.com/cpu-throttling: "false"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: gcr.io/PROJECT_ID/chatrag:latest
          ports:
            - containerPort: 8080
          resources:
            limits:
              memory: 2Gi
              cpu: "2"
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "8080"
            - name: DATABASE_URL
              value: "REPLACE_WITH_CLOUD_SQL_URL"
            # Chroma runs in-process (local PersistentClient) for lowest latency
            - name: CHROMA_MODE
              value: local
            - name: OPENAI_API_KEY
              value: "REPLACE_WITH_OPENAI_KEY"
            - name: STORAGE_PROVIDER
              value: disk
            - name: FRONTEND_DIST_PATH
              value: /app/frontend/dist
            - name: PYTHON_BIN
              value: /app/python/.venv/bin/python3
            - name: PYTHON_PROJECT_ROOT
              value: /app/python
            - name: PYTHON_SERVER_URL
              value: "http://localhost:8321"
