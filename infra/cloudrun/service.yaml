apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: chatrag
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "2"
        autoscaling.knative.dev/maxScale: "4"
        run.googleapis.com/cpu-throttling: "false"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: gcr.io/PROJECT_ID/chatrag:latest
          ports:
            - containerPort: 8080
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            limits:
              memory: 16Gi
              cpu: "8"
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "8080"
            - name: DATABASE_URL
              value: "REPLACE_WITH_CLOUD_SQL_URL"
            # Chroma runs in-process (local PersistentClient) for lowest latency
            - name: CHROMA_MODE
              value: local
            - name: ANONYMIZED_TELEMETRY
              value: "False"
            - name: OPENAI_API_KEY
              value: "REPLACE_WITH_OPENAI_KEY"
            - name: REPLICATE_API_TOKEN
              value: "REPLACE_WITH_REPLICATE_TOKEN"
            - name: STORAGE_PROVIDER
              value: disk
            - name: WORKER_MODE
              value: local
            - name: FRONTEND_DIST_PATH
              value: /app/frontend/dist
            # No OTLP collector in Cloud Run — disable to avoid deadline timeout errors
            - name: OTEL_ENABLED
              value: "false"
            - name: PYTHON_BIN
              value: /app/python/.venv/bin/python3
            - name: PYTHON_PROJECT_ROOT
              value: /app/python
            - name: PYTHON_SERVER_URL
              value: "http://localhost:8321"
            # Local PDF OCR disabled in production — uses OpenAI vision OCR as fallback
            - name: LOCAL_PDF_OCR_ENABLED
              value: "false"
