# Cloud Run Service: chatrag-indexer
#
# A dedicated worker that handles CPU-heavy PDF indexing delegated from the main
# chatrag service. Runs the same Docker image but with restricted ingress so only
# the main service (inside the same VPC) can call it.
#
# Deploy with:
#   gcloud run services replace infra/cloudrun/service-indexer.yaml --region=europe-west1
#
# Or via deploy-gcp.sh (automated).
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: chatrag-indexer
  annotations:
    # Allow internal VPC traffic + Cloud Load Balancer only (not public internet)
    run.googleapis.com/ingress: internal-and-cloud-load-balancing
spec:
  template:
    metadata:
      annotations:
        # Always keep 1 instance warm so delegation has near-zero cold-start latency.
        # Scale to 2 under heavy concurrent indexing load.
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "2"
        # Keep CPU allocated while running — indexing is CPU-bound
        run.googleapis.com/cpu-throttling: "false"
    spec:
      # Low concurrency: indexing is CPU-heavy, avoid overloading a single instance
      containerConcurrency: 4
      # Large PDFs can take a long time to process
      timeoutSeconds: 600
      containers:
        - image: gcr.io/PROJECT_ID/chatrag:latest
          ports:
            - containerPort: 8080
          resources:
            limits:
              # More CPU/memory than the main service — optimised for PDF workloads
              memory: 4Gi
              cpu: "4"
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "8080"
            - name: DATABASE_URL
              value: "REPLACE_WITH_CLOUD_SQL_URL"
            - name: CHROMA_MODE
              value: local
            - name: ANONYMIZED_TELEMETRY
              value: "False"
            - name: OPENAI_API_KEY
              value: "REPLACE_WITH_OPENAI_KEY"
            - name: REPLICATE_API_TOKEN
              value: "REPLACE_WITH_REPLICATE_TOKEN"
            - name: STORAGE_PROVIDER
              value: gcs
            - name: GCS_BUCKET
              value: "REPLACE_WITH_GCS_BUCKET"
            - name: WORKER_MODE
              value: local
            - name: FRONTEND_DIST_PATH
              value: ""
            - name: PYTHON_BIN
              value: /app/python/.venv/bin/python3
            - name: PYTHON_PROJECT_ROOT
              value: /app/python
            - name: PYTHON_SERVER_URL
              value: "http://localhost:8321"
            # The indexer authenticates callers with this shared secret.
            # Must match INDEXER_SECRET on the main chatrag service.
            - name: INDEXER_SECRET
              value: "REPLACE_WITH_SHARED_SECRET"
            # The indexer doesn't delegate further — it IS the worker
            - name: INDEXER_URL
              value: ""
