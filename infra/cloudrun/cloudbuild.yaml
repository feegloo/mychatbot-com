steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "--build-arg"
      - "VITE_COMMIT_HASH=$SHORT_SHA"
      - "-t"
      - "gcr.io/$PROJECT_ID/chatrag:$SHORT_SHA"
      - "-t"
      - "gcr.io/$PROJECT_ID/chatrag:latest"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/$PROJECT_ID/chatrag:$SHORT_SHA"]

  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/$PROJECT_ID/chatrag:latest"]

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "chatrag"
      - "--image"
      - "gcr.io/$PROJECT_ID/chatrag:$SHORT_SHA"
      - "--region"
      - "europe-west1"
      - "--platform"
      - "managed"
      - "--allow-unauthenticated"
      - "--port"
      - "8080"
      - "--memory"
      - "1Gi"
      - "--cpu"
      - "1"
      - "--min-instances"
      - "0"
      - "--max-instances"
      - "3"
      - "--set-env-vars"
      - "NODE_ENV=production"

images:
  - "gcr.io/$PROJECT_ID/chatrag:$SHORT_SHA"
  - "gcr.io/$PROJECT_ID/chatrag:latest"
