<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c084fc;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38bdf8;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Chat bubble -->
  <g transform="translate(5, 4)">
    <rect x="2" y="2" width="50" height="40" rx="11" ry="11" fill="url(#grad1)" opacity="0.9"/>
    <polygon points="16,42 25,54 32,42" fill="url(#grad1)" opacity="0.9"/>
    <!-- RAG nodes -->
    <circle cx="17" cy="17" r="5" fill="#0b0f1a" opacity="0.7"/>
    <circle cx="37" cy="17" r="5" fill="#0b0f1a" opacity="0.7"/>
    <circle cx="27" cy="31" r="5" fill="#0b0f1a" opacity="0.7"/>
    <!-- Connecting lines -->
    <line x1="17" y1="17" x2="37" y2="17" stroke="#0b0f1a" stroke-width="1.5" opacity="0.4"/>
    <line x1="17" y1="17" x2="27" y2="31" stroke="#0b0f1a" stroke-width="1.5" opacity="0.4"/>
    <line x1="37" y1="17" x2="27" y2="31" stroke="#0b0f1a" stroke-width="1.5" opacity="0.4"/>
    <!-- Bright centers -->
    <circle cx="17" cy="17" r="2.5" fill="#e0e7ff"/>
    <circle cx="37" cy="17" r="2.5" fill="#e0e7ff"/>
    <circle cx="27" cy="31" r="2.5" fill="#e0e7ff"/>
  </g>
</svg>
