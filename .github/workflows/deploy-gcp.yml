name: Deploy to GCP Cloud Run

on:
  push:
    branches:
      - main #TODO: main

env:
  REGION: europe-west1
  SERVICE_NAME: chatrag
  IMAGE_NAME: chatrag

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCR
        run: |
          gcloud auth configure-docker gcr.io

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            gcr.io/${{ secrets.GCP_PROJECT_ID }}/${{ env.IMAGE_NAME }}:latest
            gcr.io/${{ secrets.GCP_PROJECT_ID }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            VITE_STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY }}
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
            VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/${{ env.IMAGE_NAME }}:latest \
            --region ${{ env.REGION }} \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            --platform managed \
            --allow-unauthenticated \
            --network default \
            --subnet default \
            --vpc-egress private-ranges-only \
            --port 8080 \
            --memory 16Gi \
            --cpu 8 \
            --min-instances 2 \
            --max-instances 4 \
            --timeout 300 \
            --update-env-vars "\
          NODE_ENV=production,\
          DATABASE_URL=${{ secrets.DATABASE_URL }},\
          CHROMA_MODE=local,\
          ANONYMIZED_TELEMETRY=False,\
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }},\
          STORAGE_PROVIDER=gcs,\
          GCS_BUCKET=${{ secrets.GCS_BUCKET }},\
          FRONTEND_DIST_PATH=/app/frontend/dist,\
          PYTHON_BIN=/app/python/.venv/bin/python3,\
          PYTHON_PROJECT_ROOT=/app/python,\
          PYTHON_SERVER_URL=http://localhost:8321,\
          USE_GEMMA=false,\
          GEMMA_MODEL=gemma4,\
          GEMMA_BASE_URL=http://localhost:11434,\
          DEBUG_USER=${{ secrets.DEBUG_USER }},\
          DEBUG_PASS=${{ secrets.DEBUG_PASS }},\
          STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }},\
          SENTRY_DSN=${{ secrets.SENTRY_DSN }},\
          WORKER_MODE=cloud_run,\
          GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }},\
          PUBSUB_TOPIC=chatrag-indexing,\
          PUBSUB_SUBSCRIPTION=chatrag-indexing-sub"

      - name: Get service URL
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            --format='value(status.url)')
          echo "Service deployed at: $URL"

      - name: Notify deployment
        if: success()
        run: |
          echo "✅ Deployment successful!"
          echo "Service: ${{ env.SERVICE_NAME }}"
          echo "Region: ${{ env.REGION }}"
          echo "Image: gcr.io/${{ secrets.GCP_PROJECT_ID }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
