name: build-test-lint

on:
  push:
    branches:
      - main
    paths:
      - 'ui/**'
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'ui/**'
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/build.yml'

jobs:
  changes:
    name: Detect changed apps
    runs-on: ubuntu-latest
    outputs:
      ui: ${{ steps.filter.outputs.ui }}
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            ui:
              - 'ui/**'
              - '.github/workflows/build.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/build.yml'
            backend:
              - 'backend/**'
              - '.github/workflows/build.yml'

  app:
    name: ${{ matrix.app }} Build, Test, Lint
    runs-on: ubuntu-latest
    needs: changes
    if: |
      (matrix.app == 'ui' && needs.changes.outputs.ui == 'true') ||
      (matrix.app == 'frontend' && needs.changes.outputs.frontend == 'true') ||
      (matrix.app == 'backend' && needs.changes.outputs.backend == 'true')

    strategy:
      fail-fast: false
      matrix:
        app: [ui, frontend, backend]

    defaults:
      run:
        working-directory: ${{ matrix.app }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build