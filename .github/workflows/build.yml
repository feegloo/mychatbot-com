name: build-test-lint

on:
  push:
    branches:
      - main
    paths:
      - 'ui/**'
      # - 'frontend/**' # disabled
      # - 'backend/**' # disabled
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'ui/**'
      # - 'frontend/**' # disabled
      # - 'backend/**' # disabled
      - '.github/workflows/build.yml'

jobs:
  changes:
    name: Detect changed apps
    runs-on: ubuntu-latest
    outputs:
      ui: ${{ steps.filter.outputs.ui }}
      # frontend: ${{ steps.filter.outputs.frontend }} # disabled
      # backend: ${{ steps.filter.outputs.backend }} # disabled
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            ui:
              - 'ui/**'
              - '.github/workflows/build.yml'
            # frontend: # disabled
            #   - 'frontend/**'
            #   - '.github/workflows/build.yml'
            # backend: # disabled
            #   - 'backend/**'
            #   - '.github/workflows/build.yml'

  ui:
    name: UI Build, Test, Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

