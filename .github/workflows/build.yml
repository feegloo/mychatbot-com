name: build

on:
  push:
    branches:
      - "2.0"
  pull_request:

jobs:
  build:
    name: Build and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache npm download cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('frontend/package.json', 'server/package.json', 'cloud-function/package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Install and build server
        working-directory: server
        run: |
          npm install
          npm run typecheck
          npm run build

      - name: Check cloud function syntax
        working-directory: cloud-function
        run: |
          npm install
          npm run check

      - name: Check worker imports and syntax
        working-directory: worker
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m compileall chatrag_worker
