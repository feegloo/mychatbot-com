name: deploy-gcp

on:
  push:
    branches:
      - "2.0"
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment: dev or prod"
        required: true
        default: "prod"
        type: choice
        options:
          - prod
          - dev

concurrency:
  group: chatrag-gcp-${{ github.event.inputs.environment || 'prod' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GCP
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ENV: ${{ github.event.inputs.environment || 'prod' }}
      CI: true
      DOCKER_BUILDKIT: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache npm download cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('frontend/package.json', 'server/package.json', 'cloud-function/package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Create service account key file
        run: |
          mkdir -p "$RUNNER_TEMP/gcp"
          printf '%s' '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}' > "$RUNNER_TEMP/gcp/key.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp/key.json" >> "$GITHUB_ENV"

      - name: Install Cloud SQL Proxy and PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client curl
          curl -fsSL -o cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.15.2/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          sudo mv cloud-sql-proxy /usr/local/bin/cloud-sql-proxy

      - name: Create local secret overrides
        run: |
          cat > "infra/.env.${ENV}.local" <<'EOF_ENV'
          # Generated by GitHub Actions from a small set of repository secrets.
          # The committed infra/.env.prod / infra/.env.dev file contains non-secret defaults.
          GOOGLE_APPLICATION_CREDENTIALS=${{ env.GOOGLE_APPLICATION_CREDENTIALS }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
          EOF_ENV

      - name: Deploy
        run: ./infra/gcp-deploy.sh
