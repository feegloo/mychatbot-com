name: Build macOS DMG

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-dmg:
    strategy:
      matrix:
        include:
          - os: macos-14        # Apple Silicon (M-series runners)
            arch: arm64
            artifact: ChatRAG-arm64.dmg
          - os: macos-13        # Intel
            arch: x64
            artifact: ChatRAG-x64.dmg

    runs-on: ${{ matrix.os }}
    name: Build DMG (${{ matrix.arch }})

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
            electron/package-lock.json

      - name: Install frontend deps & build
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Install backend deps
        run: |
          cd backend
          npm ci

      - name: Install Electron deps
        run: |
          cd electron
          npm ci

      - name: Build DMG
        env:
          # Code signing — leave empty for unsigned (notarization requires paid Apple Dev account)
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          cd electron
          npm run dist -- --${{ matrix.arch }}
          # Rename output to consistent name
          DMG=$(ls dist/*.dmg | head -1)
          mv "$DMG" "dist/${{ matrix.artifact }}"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: electron/dist/${{ matrix.artifact }}
          retention-days: 90

  release:
    needs: build-dmg
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/ChatRAG-arm64.dmg/ChatRAG-arm64.dmg
            artifacts/ChatRAG-x64.dmg/ChatRAG-x64.dmg
          generate_release_notes: true
          draft: false
          prerelease: false
