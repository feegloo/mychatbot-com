version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: mychatbot-postgres
    environment:
      POSTGRES_USER: mychatbot
      POSTGRES_PASSWORD: mychatbot
      POSTGRES_DB: mychatbot
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

  chroma:
    image: chromadb/chroma:0.5.23
    container_name: mychatbot-chroma
    ports:
      - "8000:8000"
    volumes:
      - ./data/chroma:/chroma/chroma
