version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: mychatbot-postgres
    environment:
      POSTGRES_USER: mychatbot
      POSTGRES_PASSWORD: mychatbot
      POSTGRES_DB: mychatbot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  chroma:
    image: chromadb/chroma:0.5.23
    container_name: mychatbot-chroma
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma

volumes:
  postgres_data:
  chroma_data: