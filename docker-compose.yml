services:
  postgres:
    image: postgres:16
    container_name: chatrag-postgres
    environment:
      POSTGRES_USER: chatrag
      POSTGRES_PASSWORD: chatrag
      POSTGRES_DB: chatrag
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  chroma:
    image: chromadb/chroma:1.0.7
    container_name: chatrag-chroma
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - ANONYMIZED_TELEMETRY=false

  # Jaeger — distributed tracing UI + OTLP collector
  # Open http://localhost:16686 to view traces, timelines, and service dependencies
  jaeger:
    image: jaegertracing/jaeger:2
    container_name: chatrag-jaeger
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  # GCP Pub/Sub emulator — lets the chatrag-worker subscriber and the
  # backend publisher talk to a real Pub/Sub-compatible broker without
  # needing GCP credentials. Both google-cloud-pubsub (Python) and
  # @google-cloud/pubsub (Node) auto-detect ``PUBSUB_EMULATOR_HOST`` and
  # route all RPCs to the local emulator.
  #
  # Topic + subscription are bootstrapped by ``infra/pubsub/setup-local.sh``
  # (or just `docker compose up pubsub-init` once the emulator is healthy).
  pubsub-emulator:
    image: gcr.io/google.com/cloudsdktool/cloud-sdk:emulators
    container_name: chatrag-pubsub
    command:
      - gcloud
      - beta
      - emulators
      - pubsub
      - start
      - --host-port=0.0.0.0:8085
      - --project=chatrag-local
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot bootstrap: creates the topic + subscription against the
  # running emulator. Idempotent — safe to re-run on every `up`.
  pubsub-init:
    image: curlimages/curl:8.10.1
    container_name: chatrag-pubsub-init
    depends_on:
      pubsub-emulator:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        BASE="http://pubsub-emulator:8085/v1/projects/chatrag-local"
        # Topic (PUT is idempotent: 409 means already exists, 200 means created)
        curl -sS -o /dev/null -w "topic: %{http_code}\n" -X PUT \
          "$$BASE/topics/chatrag-indexing" || true
        # Subscription with 600s ack deadline for long-running PDF jobs
        curl -sS -o /dev/null -w "sub: %{http_code}\n" -X PUT \
          -H "Content-Type: application/json" \
          -d '{"topic":"projects/chatrag-local/topics/chatrag-indexing","ackDeadlineSeconds":600}' \
          "$$BASE/subscriptions/chatrag-indexing-sub" || true
        echo "Pub/Sub emulator ready."
    restart: "no"

volumes:
  postgres_data:
  chroma_data: