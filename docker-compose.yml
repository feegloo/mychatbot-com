services:
  postgres:
    image: postgres:16
    container_name: chatrag-postgres
    environment:
      POSTGRES_USER: chatrag
      POSTGRES_PASSWORD: chatrag
      POSTGRES_DB: chatrag
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  chroma:
    image: chromadb/chroma:1.0.7
    container_name: chatrag-chroma
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - ANONYMIZED_TELEMETRY=false

  # Ollama — local LLM server for Gemma 4
  # Auto-pulls the model on first start (set OLLAMA_MODEL to change, default: gemma4:e2b)
  # To use a different model: OLLAMA_MODEL=gemma4:26b docker compose up -d
  # TEMPORARILY DISABLED in dev localhost — re-enable when offline model is needed
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: chatrag-ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #     - ./infra/ollama-entrypoint.sh:/ollama-entrypoint.sh:ro
  #   environment:
  #     - OLLAMA_MODEL=${OLLAMA_MODEL:-gemma4:e2b}
  #   entrypoint: ["/ollama-entrypoint.sh"]

  # Jaeger — distributed tracing UI + OTLP collector
  # Open http://localhost:16686 to view traces, timelines, and service dependencies
  jaeger:
    image: jaegertracing/jaeger:2
    container_name: chatrag-jaeger
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true

volumes:
  postgres_data:
  chroma_data:
  # ollama_data:  # TEMPORARILY DISABLED along with ollama service