line-length = 100
target-version = "py311"

[lint]
select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "W",    # pycodestyle warnings
  "I",    # isort
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "SIM",  # flake8-simplify
  "LOG",  # flake8-logging
]

[lint.per-file-ignores]
# Prompt-heavy modules — long string literals are intentional
"src/shared/rag.py" = ["E501"]
"src/shared/describe.py" = ["E501"]
"src/shared/suggested_questions.py" = ["E501"]
"src/shared/prompts/*.py" = ["E501"]
# Other source files with occasional long lines (URLs, log messages, complex conditions)
"src/server.py" = ["E501", "E402"]
"src/shared/extractors.py" = ["E501"]
"src/shared/image_gen.py" = ["E501", "E402"]
"src/shared/video_gen.py" = ["E501"]
"src/shared/music_gen.py" = ["E501"]
"src/shared/page_worker.py" = ["E501"]
"src/shared/indexing.py" = ["E501", "B023"]
"src/shared/chapters.py" = ["E501"]
"src/shared/url_fetch.py" = ["E501"]
# Test files — grouping imports near the test class/function is intentional
"tests/*.py" = ["E501", "E402"]

[lint.isort]
known-first-party = ["shared"]

[format]
quote-style = "double"
