line-length = 100
target-version = "py311"

[lint]
select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "W",    # pycodestyle warnings
  "I",    # isort
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "SIM",  # flake8-simplify
  "LOG",  # flake8-logging
]

[lint.per-file-ignores]
"shared/rag.py" = ["E501"]
"shared/describe.py" = ["E501"]
"shared/suggested_questions.py" = ["E501"]
"shared/prompts/*.py" = ["E501"]

[lint.isort]
known-first-party = ["shared"]

[format]
quote-style = "double"
